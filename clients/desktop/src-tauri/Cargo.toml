[package]
name = "sis-desktop"
version = "0.1.0"
description = "Desktop shell for the Student Information System."
edition = "2024"
license = "Apache-2.0"
publish = false

# This crate is intentionally outside the root Cargo workspace so that
# backend builds and tests do not compile the desktop toolkit.
[workspace]

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
name = "sis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
